<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Paciente | Red Norte</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-body">
  <nav class="topbar">
    <div class="container-app topbar-content">
      <div class="brand small-brand">
        <div class="brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span>Red Norte</span>
      </div>
      <a href="index.html" class="btn btn-outline-light btn-sm">Volver al login</a>
    </div>
  </nav>

  <main class="page-section">
    <div class="container-app">
      <div class="page-card page-card-narrow">
        <div class="page-header">
          <h1>Registro de paciente</h1>
          <p>Completa tus datos para crear tu cuenta en la plataforma.</p>
        </div>

        <form id="registerForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Apellido</label>
            <input type="text" id="apellido" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">RUT</label>
            <input type="text" id="rut" class="form-control" placeholder="12.345.678-9" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Diagnóstico</label>
            <input type="text" id="diagnostico" class="form-control" placeholder="Ej: Control general" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" required />
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary app-btn">
              <i class="bi bi-person-plus-fill me-2"></i>
              Crear cuenta
            </button>
          </div>

          <div class="col-12">
            <div id="registerMessage" class="alert d-none mt-2"></div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
