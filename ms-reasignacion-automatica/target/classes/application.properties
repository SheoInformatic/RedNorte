# Application
spring.application.name=ms-reasignacion-automatica
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rednorte_reasignacion?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=rednorte_user
spring.datasource.password=rednorte_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-enums-using-to-string=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=America/Santiago
spring.jackson.date-format=yyyy-MM-dd

# Scheduler
spring.task.scheduling.pool.size=2

# Logging
logging.level.cl.rednorte.reasignacion=DEBUG
logging.level.org.springframework.scheduling=INFO
