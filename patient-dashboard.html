<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal del Paciente | Red Norte</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-body">
  <nav class="topbar">
    <div class="container-app topbar-content">
      <div class="brand small-brand">
        <div class="brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span>Portal Paciente</span>
      </div>
      <div class="topbar-actions">
        <a href="booking.html" class="btn btn-light btn-sm">Reservar hora</a>
        <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
      </div>
    </div>
  </nav>

  <main class="page-section">
    <div class="container-app">
      <section class="page-card mb-4">
        <div class="page-header">
          <h1>Bienvenido, paciente</h1>
          <p>Consulta tus datos y tus reservas médicas.</p>
        </div>

        <div class="profile-grid">
          <div class="profile-item">
            <span>Nombre</span>
            <strong id="profileNombre">-</strong>
          </div>
          <div class="profile-item">
            <span>Apellido</span>
            <strong id="profileApellido">-</strong>
          </div>
          <div class="profile-item">
            <span>RUT</span>
            <strong id="profileRut">-</strong>
          </div>
          <div class="profile-item">
            <span>Diagnóstico</span>
            <strong id="profileDiagnostico">-</strong>
          </div>
        </div>
      </section>

      <section class="page-card">
        <div class="page-header">
          <h2>Mis reservas</h2>
          <p>Estas son tus horas médicas agendadas.</p>
        </div>

        <div class="table-responsive">
          <table class="table align-middle custom-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Centro</th>
                <th>Especialidad</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="patientBookingsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/patient.js"></script>
</body>
</html>
