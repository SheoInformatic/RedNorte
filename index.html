<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Salud Digital</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <main class="login-container">
    <div class="login-card">

      <div class="login-left">
        <div class="brand">
          <div class="brand-icon">
            <i class="bi bi-heart-pulse-fill"></i>
          </div>
          <span>Salud Digital RED NORTE</span>
        </div>

        <h1>Bienvenido</h1>
        <p>
          Accede al sistema para gestionar pacientes, usuarios y procesos internos
          de forma segura y centralizada.
        </p>

        <div class="features">
          <div class="feature">
            <i class="bi bi-person-check-fill"></i>
            <span>Gestión de usuarios</span>
          </div>
          <div class="feature">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Acceso protegido</span>
          </div>
          <div class="feature">
            <i class="bi bi-clipboard2-pulse-fill"></i>
            <span>Control del sistema</span>
          </div>
        </div>
      </div>

      <div class="login-right">
        <div class="login-logo">
          <i class="bi bi-hospital-fill"></i>
        </div>

        <h2>Iniciar sesión</h2>
        <p class="subtitle">Ingresa tus credenciales</p>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <div class="input-group custom-input">
              <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="admin@salud.cl"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group custom-input">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="rol" class="form-label">Tipo de acceso</label>
            <select class="form-select custom-select" id="rol" required>
              <option value="" selected disabled>Selecciona un perfil</option>
              <option value="ADMIN">Administrador</option>
              <option value="PACIENTE">Paciente</option>
            </select>
          </div>

          <div class="options-row">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Recordarme</label>
            </div>
            <a href="#" class="link-recover">Recuperar acceso</a>
          </div>

          <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Entrar al sistema
          </button>

          <div id="message" class="alert d-none mt-3"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const rol = document.getElementById("rol").value;

      if (!email || !password || !rol) {
        showMessage("Completa todos los campos.", "danger");
        return;
      }

      showMessage("Login listo para conectar con JWT.", "success");
    });

    function showMessage(text, type) {
      message.className = `alert alert-${type} mt-3`;
      message.textContent = text;
      message.classList.remove("d-none");
    }
  </script>

</body>
</html>
