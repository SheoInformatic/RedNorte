<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Hora | Red Norte</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-body">
  <nav class="topbar">
    <div class="container-app topbar-content">
      <div class="brand small-brand">
        <div class="brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span>Red Norte</span>
      </div>
      <div class="topbar-actions">
        <a href="patient-dashboard.html" class="btn btn-light btn-sm">Volver</a>
      </div>
    </div>
  </nav>

  <main class="page-section">
    <div class="container-app">
      <div class="page-card page-card-narrow">
        <div class="page-header">
          <h1>Reserva de hora médica</h1>
          <p>Selecciona tu fecha, centro de atención y especialidad.</p>
        </div>

        <form id="bookingForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Fecha de atención</label>
            <input type="date" id="fechaAtencion" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Centro de atención</label>
            <select id="centroAtencion" class="form-select" required>
              <option value="" selected disabled>Selecciona un centro</option>
              <option>Hospital Central</option>
              <option>Centro Norte</option>
              <option>Clínica Comunitaria</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Especialidad</label>
            <select id="especialidad" class="form-select" required>
              <option value="" selected disabled>Selecciona una especialidad</option>
              <option>Medicina General</option>
              <option>Traumatología</option>
              <option>Pediatría</option>
              <option>Dermatología</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <input type="text" class="form-control" value="Reservada" disabled />
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary app-btn">
              <i class="bi bi-calendar-plus-fill me-2"></i>
              Confirmar reserva
            </button>
          </div>

          <div class="col-12">
            <div id="bookingMessage" class="alert d-none mt-2"></div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/patient.js"></script>
</body>
</html>
